  /* ----- MISE EN PAGE LIVE (tout visible sans scroll, jusqu'à 34 cartes) ----- */
  const LIVE_PORTRAIT_RATIO = 4 / 3;

  function liveGapForCount(count) {
    if (count >= 30) return 3;
    if (count >= 22) return 4;
    if (count >= 16) return 5;
    if (count >= 10) return 6;
    if (count >= 6) return 8;
    return 10;
  }

  function getLiveSectionMetrics(section) {
    const grid = section.querySelector('.students-live-grid');
    const title = section.querySelector('.live-group-title');
    const count = grid?.children.length || 0;
    if (!grid || !count) return null;

    const cs = getComputedStyle(section);
    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
    const titleH = title
      ? title.offsetHeight + parseFloat(getComputedStyle(title).marginBottom || 0)
      : 0;

    return {
      grid,
      count,
      availW: Math.max(0, section.clientWidth - padX),
      availH: Math.max(0, section.clientHeight - padY - titleH)
    };
  }

  function layoutFits(count, cols, cardW, cardH, availW, availH, gap) {
    const rows = Math.ceil(count / cols);
    const totalW = cols * cardW + Math.max(0, cols - 1) * gap;
    const totalH = rows * cardH + Math.max(0, rows - 1) * gap;
    return totalW <= availW + 1 && totalH <= availH + 1;
  }

  function computeBestLiveLayout(count, availW, availH, gap, ratio = LIVE_PORTRAIT_RATIO) {
    if (!count || availW <= 0 || availH <= 0) return null;

    let best = { cols: 1, rows: count, cardW: 0, cardH: 0 };
    for (let cols = 1; cols <= count; cols++) {
      const rows = Math.ceil(count / cols);
      const maxW = (availW - gap * (cols - 1)) / cols;
      const maxH = (availH - gap * (rows - 1)) / rows;
      if (maxW <= 0 || maxH <= 0) continue;
      const cardW = Math.floor(Math.min(maxW, maxH / ratio));
      if (cardW > best.cardW) best = { cols, rows, cardW, cardH: Math.floor(cardW * ratio) };
    }

    return best.cardW > 0 ? best : null;
  }

  function computeLayoutForCardSize(count, availW, availH, gap, cardW, ratio = LIVE_PORTRAIT_RATIO) {
    const cardH = Math.floor(cardW * ratio);
    if (cardW <= 0 || cardH <= 0) return null;

    let best = null;
    let bestSlack = Infinity;
    for (let cols = 1; cols <= count; cols++) {
      const rows = Math.ceil(count / cols);
      if (!layoutFits(count, cols, cardW, cardH, availW, availH, gap)) continue;
      const slack = availH - (rows * cardH + Math.max(0, rows - 1) * gap);
      if (slack < bestSlack) {
        bestSlack = slack;
        best = { cols, rows, cardW, cardH };
      }
    }
    return best;
  }

  function growSharedCardWidth(metrics, gap, startCardW, ratio = LIVE_PORTRAIT_RATIO) {
    let sharedCardW = startCardW;
    while (sharedCardW < 400) {
      const nextW = sharedCardW + 1;
      const fitsAll = metrics.every(m =>
        computeLayoutForCardSize(m.count, m.availW, m.availH, gap, nextW, ratio)
      );
      if (!fitsAll) break;
      sharedCardW = nextW;
    }
    return sharedCardW;
  }

  function applyLiveGridLayout(grid, layout, gap) {
    if (!grid || !layout) return;
    const { cols, rows, cardW, cardH } = layout;
    const dense = cols * rows >= 20;
    const plotCoef = dense ? 0.22 : 0.24;
    const plotMin = dense ? 28 : 14;
    const plotCap = 36;
    const maxPlot = Math.floor((cardW - 4) / 2.3);
    let plot = Math.min(Math.round(cardW * plotCoef), plotCap, maxPlot);
    plot = Math.max(plot, dense ? Math.min(plotMin, maxPlot) : plotMin);
    const dist = Math.max(
      0.42,
      Math.min(cardW * 0.085, dense ? 0.58 : 0.66)
    );
    const bandH = plot + 6;
    const avatarFont = Math.max(11, Math.min(Math.round(cardW * 0.24), 34));

    grid.style.setProperty('--live-cols', cols);
    grid.style.setProperty('--live-rows', rows);
    grid.style.setProperty('--live-gap', gap + 'px');
    grid.style.setProperty('--live-card-w', cardW + 'px');
    grid.style.setProperty('--live-card-h', cardH + 'px');
    grid.style.setProperty('--live-avatar-font', avatarFont + 'px');
    grid.style.setProperty('--live-dist', dist + 'rem');
    grid.style.setProperty('--live-plot', plot + 'px');
    grid.style.setProperty('--live-plot-font', Math.max(11, Math.round(plot * 0.5)) + 'px');
    grid.style.setProperty('--live-overlay-pad', Math.max(4, Math.round(cardW * 0.05)) + 'px');
    grid.style.setProperty('--live-band-h', bandH + 'px');
    grid.style.setProperty('--live-init-top', Math.max(14, Math.min(26, Math.round(cardW * 0.12))) + '%');
    grid.classList.toggle('live-grid-dense', dense);
  }

  function layoutLivePage() {
    const page = document.querySelector('.live-page');
    if (!page) return;

    const sections = [...page.querySelectorAll('.live-gender-section')];
    const metrics = sections.map(getLiveSectionMetrics).filter(Boolean);
    if (!metrics.length) return;

    const maxCount = Math.max(...metrics.map(m => m.count));
    const gap = liveGapForCount(maxCount);
    const isSplit = metrics.length > 1;
    const splitEl = page.querySelector('.students-live-split');

    if (isSplit && splitEl?.clientHeight > 0) {
      metrics.forEach(m => {
        const section = m.grid.closest('.live-gender-section');
        if (!section) return;
        const cs = getComputedStyle(section);
        const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
        const title = section.querySelector('.live-group-title');
        const titleH = title
          ? title.offsetHeight + parseFloat(getComputedStyle(title).marginBottom || 0)
          : 0;
        m.availH = Math.max(m.availH, splitEl.clientHeight - padY - titleH);
      });
    }

    if (!isSplit) {
      const m = metrics[0];
      applyLiveGridLayout(m.grid, computeBestLiveLayout(m.count, m.availW, m.availH, gap), gap);
      return;
    }

    const candidates = metrics.map(m => computeBestLiveLayout(m.count, m.availW, m.availH, gap));
    const baseCardW = Math.min(...candidates.map(c => c?.cardW || 0).filter(Boolean));
    if (!baseCardW) return;

    const sharedCardW = growSharedCardWidth(metrics, gap, baseCardW);
    metrics.forEach(m => {
      const layout = computeLayoutForCardSize(m.count, m.availW, m.availH, gap, sharedCardW);
      if (layout) applyLiveGridLayout(m.grid, layout, gap);
    });
  }

  function syncLiveViewport() {
    if (!document.body.classList.contains('view-live')) return;
    const main = document.querySelector('body.view-live .main-content');
    if (!main) return;

    if (window.visualViewport) {
      const vv = window.visualViewport;
      const topInset = Math.max(0, Math.round(vv.offsetTop));
      main.style.paddingTop = `calc(${topInset}px + .2rem + var(--safe-t))`;
      main.style.height = `${Math.round(vv.height)}px`;
      main.style.maxHeight = `${Math.round(vv.height)}px`;
    } else {
      main.style.paddingTop = '';
      main.style.height = '';
      main.style.maxHeight = '';
    }
  }

  function teardownLiveViewport() {
    if (liveViewportHandler && window.visualViewport) {
      window.visualViewport.removeEventListener('resize', liveViewportHandler);
      window.visualViewport.removeEventListener('scroll', liveViewportHandler);
    }
    liveViewportHandler = null;
    const main = document.querySelector('.main-content');
    if (main) {
      main.style.paddingTop = '';
      main.style.height = '';
      main.style.maxHeight = '';
    }
  }

  function setupLiveViewport() {
    teardownLiveViewport();
    syncLiveViewport();
    window.scrollTo(0, 0);
    if (!window.visualViewport) return;

    liveViewportHandler = () => {
      requestAnimationFrame(() => {
        syncLiveViewport();
        layoutLivePage();
      });
    };
    window.visualViewport.addEventListener('resize', liveViewportHandler);
    window.visualViewport.addEventListener('scroll', liveViewportHandler);
  }

  function setupLiveLayout() {
    if (liveLayoutHandler) {
      window.removeEventListener('resize', liveLayoutHandler);
      window.removeEventListener('orientationchange', liveLayoutHandler);
    }
    if (liveResizeObserver) liveResizeObserver.disconnect();

    liveLayoutHandler = () => requestAnimationFrame(layoutLivePage);
    const scheduleLayout = () => {
      syncLiveViewport();
      requestAnimationFrame(layoutLivePage);
      [50, 150, 350].forEach(ms => setTimeout(() => {
        syncLiveViewport();
        layoutLivePage();
      }, ms));
    };

    scheduleLayout();
    window.addEventListener('resize', liveLayoutHandler);
    window.addEventListener('orientationchange', liveLayoutHandler);

    const page = document.querySelector('.live-page');
    if (page && typeof ResizeObserver !== 'undefined') {
      liveResizeObserver = new ResizeObserver(liveLayoutHandler);
      liveResizeObserver.observe(page);
      page.querySelectorAll('.live-gender-section, .students-live-split').forEach(el => {
        liveResizeObserver.observe(el);
      });
    }
  }

  /* ----- SUIVI LIVE ----- */
  function renderLive(app, params) {
    const session = getSession(params.sessionId);
    const cls = getClass(session?.classId);
    const ss = session?.situations?.[params.sitIdx];
    const tpl = getSituation(ss?.templateId);
    if (!session || !ss || !tpl) { goBack(); return; }

    const series = ss.series?.[params.seriesIdx];
    if (!series) { goBack(); return; }

    const totalSec = (tpl.durationMinutes || 0) * 60 + (tpl.durationSeconds || 0);
    if (!liveState || liveState.key !== `${params.sessionId}-${params.sitIdx}-${params.seriesIdx}`) {
      liveState = {
        key: `${params.sessionId}-${params.sitIdx}-${params.seriesIdx}`,
        remaining: totalSec,
        startedAt: Date.now(),
        totalSec
      };
    }

    const sortStudents = (a, b) =>
      a.lastName.localeCompare(b.lastName, 'fr') || a.firstName.localeCompare(b.firstName, 'fr');

    const buildLiveCard = (st) => {
      const sid = st.id;
      const r = series.results[sid] || { laps: 0, extraPlots: 0 };
      const dist = calcDistance(r.laps, r.extraPlots, tpl.lapSize, tpl.plotInterval);
      return `
        <div class="student-live-card" data-student-id="${sid}">
          <div class="live-card-media">${avatarHtml(st, 'avatar-live')}</div>
          <div class="live-card-controls-band">
            <button class="plot-btn minus" data-action="plot-minus" data-sid="${sid}">−</button>
            <div class="distance" data-dist="${sid}">${dist}</div>
            <button class="plot-btn plus" data-action="plot-plus" data-sid="${sid}">+</button>
          </div>
        </div>`;
    };

    const activeStudents = (series.studentIds || [])
      .map(sid => cls.students.find(s => s.id === sid))
      .filter(Boolean)
      .sort(sortStudents);

    const girls = activeStudents.filter(st => st.gender === 'F');
    const boys = activeStudents.filter(st => st.gender === 'M');
    const others = activeStudents.filter(st => st.gender !== 'F' && st.gender !== 'M');

    const renderGenderSection = (title, titleClass, sectionClass, list) => {
      if (!list.length) return '';
      return `
        <section class="live-gender-section ${sectionClass}">
          <h2 class="live-group-title ${titleClass}">${escapeHtml(title)}</h2>
          <div class="students-live-grid">${list.map(buildLiveCard).join('')}</div>
        </section>`;
    };

    const liveSections = [
      renderGenderSection('Filles', 'girls', 'girls', girls),
      renderGenderSection('Garçons', 'boys', 'boys', boys),
      others.length ? `
        <section class="live-gender-section" style="grid-column:1/-1">
          <h2 class="live-group-title">Autres</h2>
          <div class="students-live-grid">${others.map(buildLiveCard).join('')}</div>
        </section>` : ''
    ].filter(Boolean).join('');

    const hasBothGenders = girls.length > 0 && boys.length > 0;
    const splitClass = hasBothGenders ? 'students-live-split' : 'students-live-split single';
    const splitCols = hasBothGenders
      ? `${girls.length}fr ${boys.length}fr`
      : '1fr';

    app.innerHTML = `
      <div class="live-page">
        <div class="live-header">
          <div class="live-info">
            <div class="live-info-item"><label>Durée</label><span>${formatDuration(tpl.durationMinutes, tpl.durationSeconds)}</span></div>
            <div class="live-info-item"><label>Tour</label><span>${tpl.lapSize} m</span></div>
            <div class="live-info-item"><label>Plots</label><span>${tpl.plotInterval} m</span></div>
            <div class="live-info-item"><label>Temps</label>
              <div class="timer-display" id="live-timer">${formatTimerDisplay(liveState.remaining)}</div>
            </div>
          </div>
          <div class="live-title-block">
            <div class="live-title">${escapeHtml(tpl.name)}</div>
            <div class="live-subtitle">Série ${params.seriesIdx + 1}</div>
          </div>
          <div class="live-actions">
            <button class="btn btn-secondary" data-action="live-back" type="button">Retour</button>
            <button class="btn btn-danger" data-action="finish-live" type="button">Terminer</button>
          </div>
        </div>
        <div class="${splitClass}" style="--live-split-cols:${splitCols}">${liveSections}</div>
      </div>`;

    loadAvatarsInContainer(app);
    setupLiveViewport();
    setupLiveLayout();
    startLiveTimer(session, params, tpl);
    bindActions(app, params);

    app.querySelectorAll('.student-live-card').forEach(card => {
      card.onclick = (e) => {
        if (e.target.closest('.plot-btn')) return;
        const sid = card.dataset.studentId;
        const r = series.results[sid] || { laps: 0, extraPlots: 0 };
        r.laps = (r.laps || 0) + 1;
        series.results[sid] = r;
        const dist = calcDistance(r.laps, r.extraPlots, tpl.lapSize, tpl.plotInterval);
        card.querySelector(`[data-dist="${sid}"]`).textContent = dist;
        saveData();
      };
    });
  }

  function startLiveTimer(session, params, tpl) {
    if (liveTimerInterval) clearInterval(liveTimerInterval);
    const timerEl = document.getElementById('live-timer');
    if (!timerEl) return;
    liveTimerInterval = setInterval(() => {
      if (!liveState) return;
      const elapsed = Math.floor((Date.now() - liveState.startedAt) / 1000);
      liveState.remaining = Math.max(0, liveState.totalSec - elapsed);
      timerEl.textContent = formatTimerDisplay(liveState.remaining);
      timerEl.classList.toggle('warning', liveState.remaining <= 30 && liveState.remaining > 0);
      timerEl.classList.toggle('ended', liveState.remaining === 0);
    }, 250);
  }

  /* ----- PERFORMANCES FRACTIONNÉ ----- */
  function renderFractionnePerf(app, params) {
    const session = getSession(params.sessionId);
    const cls = getClass(session?.classId);
    const ss = session?.situations?.[params.sitIdx];
    const tpl = getSituation(ss?.templateId);
    if (!session || !cls || !ss || !tpl || !isFractionneSituation(tpl)) { goBack(); return; }
    if (!getSituationDurationSec(tpl)) {
      showAlert('Indiquez une durée pour cette situation fractionnée.');
      goBack();
      return;
    }

    const perf = ensureFractionnePerf(ss);
    const seriesCount = getSeriesCount(ss);
    const repetitions = getRepetitions(ss);
    const durationSec = getSituationDurationSec(tpl);
    const inputMode = perf.inputMode || 'speed';

    setHeader(tpl.name, `Fractionné — ${session.name}`);

    const students = [...(cls.students || [])].sort((a, b) =>
      a.lastName.localeCompare(b.lastName, 'fr') || a.firstName.localeCompare(b.firstName, 'fr')
    );

    const seriesHeaders = Array.from({ length: seriesCount }, (_, i) =>
      `<th>Série ${i + 1}</th>`
    ).join('');

    const rows = students.map(st => {
      const stored = perf.values[st.id]?.series || [];
      const nameClass = studentNameClass(st);

      const seriesCells = Array.from({ length: seriesCount }, (_, i) => {
        const raw = stored[i];
        const value = raw != null && raw !== '' ? raw : '';
        const metrics = getFractionneSeriesMetrics(parseFloat(value) || 0, inputMode, repetitions, durationSec, st);

        return `<td class="bilan-cell">
          <input type="text" inputmode="decimal" class="frac-perf-input" data-frac-student="${st.id}" data-frac-series="${i}" value="${value !== '' ? value : ''}" placeholder="—">
          <span class="frac-cell-meta" data-frac-meta="${st.id}-${i}">${value ? `${metrics.seriesDist} m<br>${formatSpeedWithVmaFromKmh(metrics.speedKmh, st)}` : ''}</span>
        </td>`;
      }).join('');

      let totalDist = 0;
      let totalTimeSec = 0;
      for (let i = 0; i < seriesCount; i++) {
        const value = parseFloat(stored[i]) || 0;
        const m = getFractionneSeriesMetrics(value, inputMode, repetitions, durationSec, st);
        totalDist += m.seriesDist;
        if (value > 0) totalTimeSec += repetitions * durationSec;
      }
      const totalSpeed = totalTimeSec > 0 ? calcSpeedKmhValue(totalDist, totalTimeSec) : null;

      return `<tr>
        <td class="${nameClass}">${escapeHtml(st.lastName)} ${escapeHtml(st.firstName)}</td>
        ${seriesCells}
        <td class="bilan-cell frac-total-cell" data-frac-total="${st.id}">
          ${totalDist > 0 ? `${totalDist} m` : '—'}
          ${totalDist > 0 ? `<span class="frac-cell-meta">${formatSpeedWithVmaFromKmh(totalSpeed, st)}</span>` : ''}
        </td>
      </tr>`;
    }).join('');

    app.innerHTML = `
      <div class="frac-mode-toggle">
        <label><input type="checkbox" id="frac-mode-speed" ${inputMode === 'speed' ? 'checked' : ''}> Vitesse</label>
        <label><input type="checkbox" id="frac-mode-distance" ${inputMode === 'distance' ? 'checked' : ''}> Distance</label>
      </div>
      <p class="section-subtitle" style="margin-bottom:.85rem">
        Saisissez la ${inputMode === 'speed' ? 'vitesse moyenne (km/h)' : 'distance moyenne (m)'} par série.
        Durée d'un effort : ${formatDuration(tpl.durationMinutes, tpl.durationSeconds)} — ${repetitions} répétition(s) par série.
      </p>
      <div class="table-wrap">
        <table class="data-table bilan-table" id="frac-perf-table">
          <thead><tr>
            <th>Élève</th>${seriesHeaders}<th>Total</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;

    const speedCb = document.getElementById('frac-mode-speed');
    const distCb = document.getElementById('frac-mode-distance');

    const applyInputMode = (mode) => {
      perf.inputMode = mode;
      perf.values = {};
      perf.completed = false;
      saveData();
      render();
    };

    const requestInputMode = (mode) => {
      if (perf.inputMode === mode) return;
      const targetLabel = mode === 'speed' ? 'Vitesse' : 'Distance';
      const revertCheckboxes = () => {
        speedCb.checked = mode === 'speed' ? false : true;
        distCb.checked = mode === 'distance' ? false : true;
      };
      if (hasFractionnePerfData(perf)) {
        confirmAction(
          `Des données sont déjà renseignées. Passer en mode ${targetLabel} effacera toutes les performances saisies. Voulez-vous continuer ?`,
          () => applyInputMode(mode),
          revertCheckboxes
        );
      } else {
        applyInputMode(mode);
      }
    };

    speedCb.onchange = () => {
      if (speedCb.checked) {
        distCb.checked = false;
        requestInputMode('speed');
      } else if (!distCb.checked) {
        speedCb.checked = true;
      }
    };
    distCb.onchange = () => {
      if (distCb.checked) {
        speedCb.checked = false;
        requestInputMode('distance');
      } else if (!speedCb.checked) {
        distCb.checked = true;
      }
    };

    app.querySelectorAll('.frac-perf-input').forEach(input => {
      input.oninput = () => {
        input.value = input.value.replace(/[^\d.,]/g, '').replace(',', '.');
      };
      input.onchange = () => {
        const sid = input.dataset.fracStudent;
        const seriesIdx = parseInt(input.dataset.fracSeries);
        const raw = input.value.trim();
        const num = raw ? parseFloat(raw.replace(',', '.')) : 0;

        if (!perf.values[sid]) perf.values[sid] = { series: [] };
        if (num > 0) perf.values[sid].series[seriesIdx] = num;
        else delete perf.values[sid].series[seriesIdx];

        if (!perf.values[sid].series.some(v => v > 0)) delete perf.values[sid];
        perf.completed = Object.keys(perf.values).some(id =>
          (perf.values[id].series || []).some(v => v > 0)
        );

        const metrics = getFractionneSeriesMetrics(num, perf.inputMode, repetitions, durationSec, cls.students.find(s => s.id === sid));
        const metaEl = app.querySelector(`[data-frac-meta="${sid}-${seriesIdx}"]`);
        if (metaEl) {
          metaEl.innerHTML = num > 0
            ? `${metrics.seriesDist} m<br>${formatSpeedWithVmaFromKmh(metrics.speedKmh, cls.students.find(s => s.id === sid))}`
            : '';
        }

        updateFractionneRowTotal(app, ss, tpl, sid, cls.students.find(s => s.id === sid));
        saveData();
      };
    });
  }

  function updateFractionneRowTotal(app, ss, tpl, studentId, student) {
    const perf = ss.fractionnePerf;
    if (!perf) return;
    const seriesCount = getSeriesCount(ss);
    const repetitions = getRepetitions(ss);
    const durationSec = getSituationDurationSec(tpl);
    const mode = perf.inputMode || 'speed';
    const stored = perf.values[studentId]?.series || [];

    let totalDist = 0;
    let totalTimeSec = 0;
    for (let i = 0; i < seriesCount; i++) {
      const value = parseFloat(stored[i]) || 0;
      const m = getFractionneSeriesMetrics(value, mode, repetitions, durationSec, student);
      totalDist += m.seriesDist;
      if (value > 0) totalTimeSec += repetitions * durationSec;
    }
    const totalSpeed = totalTimeSec > 0 ? calcSpeedKmhValue(totalDist, totalTimeSec) : null;
    const cell = app.querySelector(`[data-frac-total="${studentId}"]`);
    if (cell) {
      cell.innerHTML = totalDist > 0
        ? `${totalDist} m<span class="frac-cell-meta">${formatSpeedWithVmaFromKmh(totalSpeed, student)}</span>`
        : '—';
    }
  }

  /* ----- BILAN SÉANCE ----- */
  function renderBilanTableBody(session, cls, editable) {
    const situations = session.situations || [];
    const presentStudents = [];

    const rows = applySessionBilanSort(cls.students, session).map(st => {
      const att = getStudentAttendance(session, st.id);
      const rowClass = att === 'absent' ? 'row-absent' : att === 'dispensed' ? 'row-dispensed' : att === 'aff' ? 'row-aff' : '';
      const dists = situations.map((_, i) => getStudentDistInSituation(session, st.id, i));
      const total = dists.reduce((a, b) => a + b, 0);
      const showData = !att || (isAttendanceWithBilanData(att) && total > 0);

      if (!showData) {
        const emptyCells = situations.map(() => '<td class="bilan-cell">—</td>').join('');
        return `<tr class="${rowClass}">
          <td>${escapeHtml(st.lastName)} ${escapeHtml(st.firstName)}</td>
          ${emptyCells}
          <td class="total-cell">${formatAttendanceStatus(att)}</td>
        </tr>`;
      }

      if (!att || (isAttendanceWithBilanData(att) && total > 0)) {
        presentStudents.push({ id: st.id, dists, total });
      }

      const cells = dists.map((d, i) => {
        const ss = situations[i];
        const tpl = getSituation(ss.templateId);
        const dur = getSituationSpeedDuration(session, i);
        const speed = formatSpeedDisplay(d, dur, st);
        const isFrac = isFractionneSituation(tpl);
        const isLibre = isLibreSituation(ss);
        if (editable && !isFrac && !isLibre) {
          return `<td class="bilan-cell">
            <input type="number" min="0" class="bilan-input" data-student="${st.id}" data-sit="${i}" value="${d}">
            <span class="cell-speed" data-speed="${st.id}-${i}">${speed}</span>
          </td>`;
        }
        const speedHtml = isLibre ? '' : `<span class="cell-speed">${speed}</span>`;
        return `<td class="bilan-cell">${d} m${speedHtml}</td>`;
      }).join('');

      return `<tr class="${rowClass}">
        <td>${escapeHtml(st.lastName)} ${escapeHtml(st.firstName)}</td>
        ${cells}
        <td class="total-cell" data-total="${st.id}">${formatBilanTotalCell(total, att)}</td>
      </tr>`;
    }).join('');

    const sitCount = situations.length;
    const sitAvgs = [];
    const sitTotals = [];
    for (let i = 0; i < sitCount; i++) {
      const vals = presentStudents.map(p => p.dists[i]).filter(v => v > 0);
      sitAvgs.push(vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : 0);
      sitTotals.push(presentStudents.reduce((s, p) => s + p.dists[i], 0));
    }
    const grandTotal = sitTotals.reduce((a, b) => a + b, 0);
    const totalVals = presentStudents.map(p => p.total).filter(v => v > 0);
    const avgTotal = totalVals.length ? Math.round(totalVals.reduce((a, b) => a + b, 0) / totalVals.length) : 0;

    const avgCells = sitAvgs.map((avg, i) => {
      const speed = calcSpeedKmh(avg, getSituationSpeedDuration(session, i));
      return `<td class="bilan-cell">${avg} m<span class="cell-speed">${speed}</span></td>`;
    }).join('');

    const totauxCells = sitTotals.map(t => `<td class="bilan-cell grand-total-cell">${t} m</td>`).join('');

    const avgRow = `<tr class="avg-row">
      <td><strong>Moyenne</strong></td>
      ${avgCells}
      <td class="total-cell">${avgTotal} m</td>
    </tr>`;

    const totauxRow = `<tr class="totaux-row">
      <td><strong>Totaux</strong></td>
      ${totauxCells}
      <td class="grand-total-cell">Séance : ${grandTotal} m</td>
    </tr>`;

    return { rows: rows + avgRow + totauxRow, presentStudents, grandTotal, sitAvgs, sitTotals, avgTotal };
  }

  function overrideBilanValue(session, studentId, sitIdx, distance) {
    const ss = session.situations[sitIdx];
    if (!ss) return;
    const tpl = getSituation(ss.templateId);
    if (!ss.series) ss.series = [];
    let serie = ss.series.find(s => s.completed);
    if (!serie) {
      serie = { studentIds: [studentId], results: {}, completed: true };
      ss.series.push(serie);
    }
    if (!serie.studentIds.includes(studentId)) serie.studentIds.push(studentId);
    serie.results[studentId] = { laps: 0, extraPlots: 0, manualDistance: distance };
    if (tpl && tpl.lapSize > 0) {
      serie.results[studentId].laps = Math.floor(distance / tpl.lapSize);
      const rest = distance - serie.results[studentId].laps * tpl.lapSize;
      if (tpl.plotInterval > 0) serie.results[studentId].extraPlots = Math.round(rest / tpl.plotInterval);
    }
  }

  function recalcBilanRow(app, session, cls, studentId) {
    const situations = session.situations || [];
    let total = 0;
    situations.forEach((ss, i) => {
      const inp = app.querySelector(`[data-student="${studentId}"][data-sit="${i}"]`);
      if (!inp) return;
      const val = parseInt(inp.value) || 0;
      total += val;
      const st = cls.students.find(s => s.id === studentId);
      const speedEl = app.querySelector(`[data-speed="${studentId}-${i}"]`);
      if (speedEl) speedEl.innerHTML = formatSpeedDisplay(val, getSituationSpeedDuration(session, i), st);
    });
    const att = getStudentAttendance(session, studentId);
    const cell = app.querySelector(`[data-total="${studentId}"]`);
    if (cell) cell.innerHTML = formatBilanTotalCell(total, att);
    refreshBilanFooter(app, session, cls);
  }

  function refreshBilanFooter(app, session, cls) {
    const tbody = app.querySelector('.bilan-table tbody');
    if (!tbody) return;
    tbody.querySelectorAll('.avg-row, .totaux-row').forEach(r => r.remove());
    const { rows } = renderBilanTableBody(session, cls, true);
    const tmp = document.createElement('tbody');
    tmp.innerHTML = rows;
    tmp.querySelectorAll('.avg-row, .totaux-row').forEach(r => tbody.appendChild(r));
  }

  /* ----- SÉLECTION ÉLÈVES SÉRIE ----- */
  function showStudentSelection(session, classObj, sitIdx, seriesIdx, onConfirm) {
    const ss = session.situations[sitIdx];
    const tpl = getSituation(ss.templateId);
    const allStudents = classObj.students || [];
    const available = getAvailableStudents(session, classObj);
    const participated = new Set();
    (ss.series || []).forEach((s, i) => {
      if (i < seriesIdx && s.completed) (s.studentIds || []).forEach(id => participated.add(id));
    });

    const sortRank = (st) => {
      const att = getStudentAttendance(session, st.id);
      if (att) return 2;
      if (participated.has(st.id)) return 1;
      return 0;
    };

    const sorted = [...allStudents].sort((a, b) => {
      const ra = sortRank(a), rb = sortRank(b);
      return ra - rb || a.lastName.localeCompare(b.lastName, 'fr') || a.firstName.localeCompare(b.firstName, 'fr');
    });

    const selected = new Set(
      seriesIdx === 0
        ? available.map(st => st.id)
        : available.filter(st => !participated.has(st.id)).map(st => st.id)
    );

    const cards = sorted.map(st => {
      const att = getStudentAttendance(session, st.id);
      const attClass = att === 'absent' ? ' attendance-absent' : att === 'dispensed' ? ' attendance-dispensed' : att === 'aff' ? ' attendance-aff' : '';
      const badge = att === 'dispensed'
        ? '<span class="select-badge status-d">D</span>'
        : att === 'absent'
          ? '<span class="select-badge status-a">A</span>'
          : att === 'aff'
            ? '<span class="select-badge status-aff">AFF</span>'
            : '';
      return `
      <div class="student-select-card${participated.has(st.id) ? ' participated' : ''}${attClass}${selected.has(st.id) ? ' selected' : ''}" data-sid="${st.id}">
        ${badge}
        ${avatarHtml(st, 'avatar-lg')}
        <div class="name">${escapeHtml(st.firstName)}<br>${escapeHtml(st.lastName)}</div>
      </div>`;
    }).join('');

    const situationTitle = `Situation ${sitIdx + 1} - ${tpl?.name || 'Sans nom'}`;

    showModal(`
      <div class="modal-select-header">
        <h3>${escapeHtml(situationTitle)}</h3>
        <p class="section-subtitle">Cochez ou décochez les élèves concernés</p>
      </div>
      <div class="select-quick-actions">
        <button type="button" class="btn btn-secondary btn-sm" id="select-all-girls">Cocher toutes les filles</button>
        <button type="button" class="btn btn-secondary btn-sm" id="select-all-boys">Cocher tous les garçons</button>
      </div>
      <div class="student-select-grid" id="select-grid">${cards}</div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-cancel">Annuler</button>
        <button class="btn btn-primary" id="modal-confirm">Valider</button>
      </div>
    `, () => {
      const grid = document.getElementById('select-grid');

      const updateCardSelection = (sid, isSelected) => {
        const card = grid.querySelector(`[data-sid="${sid}"]`);
        if (!card) return;
        card.classList.toggle('selected', isSelected);
      };

      const selectByGender = (gender) => {
        const genderStudents = available.filter(st => st.gender === gender);
        if (!genderStudents.length) return;
        const allSelected = genderStudents.every(st => selected.has(st.id));
        genderStudents.forEach(st => {
          if (allSelected) {
            selected.delete(st.id);
            updateCardSelection(st.id, false);
          } else {
            selected.add(st.id);
            updateCardSelection(st.id, true);
          }
        });
      };

      loadAvatarsInContainer(grid);
      grid.querySelectorAll('.student-select-card').forEach(card => {
        card.onclick = () => {
          const sid = card.dataset.sid;
          if (selected.has(sid)) { selected.delete(sid); card.classList.remove('selected'); }
          else { selected.add(sid); card.classList.add('selected'); }
        };
      });
      document.getElementById('select-all-girls').onclick = () => selectByGender('F');
      document.getElementById('select-all-boys').onclick = () => selectByGender('M');
      document.getElementById('modal-cancel').onclick = closeModal;
      document.getElementById('modal-confirm').onclick = () => {
        if (!selected.size) { showAlert('Sélectionnez au moins un élève.'); return; }
        const reselected = [...selected].filter(id => participated.has(id));
        if (reselected.length) {
          const names = reselected.map(id => {
            const st = classObj.students.find(s => s.id === id);
            return st ? `${st.firstName} ${st.lastName}` : id;
          }).join(', ');
          confirmAction(
            `${names} ont déjà participé à une série précédente. Leurs résultats seront remplacés. Continuer ?`,
            () => { closeModal(); onConfirm([...selected]); }
          );
        } else {
          closeModal();
          onConfirm([...selected]);
        }
      };
    });
  }

  function launchSituation(sessionId, sitIdx, seriesIdx, studentIds) {
    const session = getSession(sessionId);
    const ss = session.situations[sitIdx];
    if (!ss.series) ss.series = [];
    while (ss.series.length <= seriesIdx) ss.series.push({ studentIds: [], results: {}, completed: false });
    const serie = ss.series[seriesIdx];
    serie.studentIds = studentIds;
    serie.results = {};
    studentIds.forEach(id => { serie.results[id] = { laps: 0, extraPlots: 0 }; });
    serie.completed = false;
    saveData();
    liveState = null;
    navigate('live', { sessionId, sitIdx, seriesIdx });
  }

  /* ----- DRAG & DROP ----- */
  function setupDragDrop(app, session) {
    let dragIdx = null;
    app.querySelectorAll('[draggable="true"]').forEach(el => {
      el.ondragstart = (e) => { dragIdx = parseInt(el.dataset.dragIdx); el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; };
      el.ondragend = () => { el.classList.remove('dragging'); dragIdx = null; };
      el.ondragover = (e) => { e.preventDefault(); el.classList.add('drag-over'); };
      el.ondragleave = () => el.classList.remove('drag-over');
      el.ondrop = (e) => {
        e.preventDefault();
        el.classList.remove('drag-over');
        const dropIdx = parseInt(el.dataset.dragIdx);
        if (dragIdx === null || dragIdx === dropIdx) return;
        const arr = session.situations;
        const [item] = arr.splice(dragIdx, 1);
        arr.splice(dropIdx, 0, item);
        saveData();
        render();
      };
    });
  }

  /* ----- CSV IMPORT ----- */
  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
    if (!lines.length) return { error: 'Fichier vide.' };
    const sep = lines[0].includes(';') ? ';' : ',';
    const header = lines[0].split(sep).map(h => h.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''));
    const nomIdx = header.findIndex(h => h === 'nom');
    const prenomIdx = header.findIndex(h => h === 'prenom');
    const sexeIdx = header.findIndex(h => h === 'sexe');
    const vmaIdx = header.findIndex(h => h === 'vma');
    if (nomIdx < 0 || prenomIdx < 0) return { error: 'Colonnes Nom et Prénom requises.' };
    const students = [];
    const errors = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(sep).map(c => c.trim().replace(/^"|"$/g, ''));
      const lastName = cols[nomIdx];
      const firstName = cols[prenomIdx];
      if (!lastName && !firstName) continue;
      if (!lastName || !firstName) { errors.push(`Ligne ${i + 1}: nom ou prénom manquant`); continue; }
      const student = {
        id: uid(), lastName, firstName,
        gender: sexeIdx >= 0 ? (cols[sexeIdx] || '') : ''
      };
      if (vmaIdx >= 0) {
        const vma = parseVmaInput(cols[vmaIdx]);
        if (vma != null) student.vma = vma;
      }
      students.push(student);
    }
    return { students, errors };
  }

  /* ----- EXPORT ----- */
  function buildBilanData(session) {
    const cls = getClass(session.classId);
    const situations = session.situations || [];
    const headers = situations.map((ss, i) => {
      const tpl = getSituation(ss.templateId);
      return {
        name: getSituationBlockName(ss, tpl) || `Situation ${i + 1}`,
        duration: tpl && !isLibreSituation(ss) ? formatDuration(tpl.durationMinutes, tpl.durationSeconds) : '',
        durationSec: getSituationSpeedDuration(session, i)
      };
    });

    const rows = sortStudentsByName(cls?.students).map(st => {
      const att = getStudentAttendance(session, st.id);
      const dists = situations.map((_, i) => getStudentDistInSituation(session, st.id, i));
      const total = dists.reduce((a, b) => a + b, 0);
      const showData = !att || (isAttendanceWithBilanData(att) && total > 0);

      if (!showData) {
        return {
          name: `${st.lastName} ${st.firstName}`,
          studentId: st.id,
          dists: situations.map(() => ''),
          distLabels: situations.map(() => ''),
          total: getAttendanceExportCode(att),
          totalLabel: formatAttendanceStatus(att).replace(/<[^>]+>/g, ''),
          status: att
        };
      }

      const distLabels = dists.map((d, i) => {
        const speedText = formatSpeedDisplay(d, headers[i].durationSec, st).replace(/<[^>]+>/g, '');
        return d > 0 ? `${d} m (${speedText})` : '0';
      });
      return {
        name: `${st.lastName} ${st.firstName}`,
        studentId: st.id,
        dists,
        distLabels,
        total,
        totalLabel: formatBilanTotalCell(total, att).replace(/<[^>]+>/g, ''),
        status: att || null
      };
    });

    const present = rows.filter(r => !r.status || (isAttendanceWithBilanData(r.status) && r.total > 0));
    const sitAvgs = headers.map((_, i) => {
      const vals = present.map(r => r.dists[i]).filter(v => v > 0);
      return vals.length ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length) : 0;
    });
    const sitTotals = headers.map((_, i) => present.reduce((s, r) => s + r.dists[i], 0));
    const grandTotal = sitTotals.reduce((a, b) => a + b, 0);
    const withTotals = present.filter(r => r.total > 0);
    const avgTotal = withTotals.length ? Math.round(withTotals.reduce((s, r) => s + r.total, 0) / withTotals.length) : 0;

    return { cls, headers, rows, sitAvgs, sitTotals, avgTotal, grandTotal, date: getSessionDateDisplay(session) };
  }

  function exportCSV(sessionId) {
    const session = getSession(sessionId);
    if (!session) return;
    const { cls, headers, rows, sitAvgs, sitTotals, avgTotal, grandTotal, date } = buildBilanData(session);
    const sitHeaders = headers.map(h => `"${h.name} (${h.duration})"`);
    const lines = [
      `Classe;${cls.name}`,
      `Séance;${session.name}`,
      `Date;${date}`,
      '',
      `Élève;${sitHeaders.join(';')};Total parcouru`
    ];
    rows.forEach(r => {
      const cols = (r.status && !(isAttendanceWithBilanData(r.status) && r.total > 0))
        ? headers.map(() => '')
        : (r.distLabels || r.dists);
      const totalCol = r.totalLabel || (r.total + ' m');
      lines.push(`"${r.name}";${cols.join(';')};${totalCol}`);
    });
    const avgCols = sitAvgs.map((a, i) => {
      const speed = calcSpeedKmh(a, headers[i].durationSec);
      return a > 0 ? `${a} m (${speed})` : '0';
    });
    lines.push(`"Moyenne";${avgCols.join(';')};${avgTotal} m`);
    lines.push(`"Totaux";${sitTotals.map(t => t + ' m').join(';')};Séance : ${grandTotal} m`);
    const blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `bilan_${cls.name}_${session.name}_${date.replace(/\//g, '-')}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function exportPDF(sessionId) {
    const session = getSession(sessionId);
    if (!session) return;
    const { cls, headers, rows, sitAvgs, sitTotals, avgTotal, grandTotal, date } = buildBilanData(session);
    const sitCols = headers.map(h => `<th>${escapeHtml(h.name)}<br><small>${escapeHtml(h.duration)}</small></th>`).join('');
    const bodyRows = rows.map(r => {
      const showData = !r.status || (isAttendanceWithBilanData(r.status) && r.total > 0);
      if (!showData) {
        return `<tr><td>${escapeHtml(r.name)}</td>${headers.map(() => '<td>—</td>').join('')}<td><strong>${escapeHtml(String(r.totalLabel || r.total))}</strong></td></tr>`;
      }
      const st = cls.students.find(s => s.id === r.studentId);
      const cells = r.dists.map((d, i) => {
        const speed = formatSpeedDisplay(d, headers[i].durationSec, st);
        return `<td>${d} m<br><small>${speed}</small></td>`;
      }).join('');
      const totalLabel = r.totalLabel || `${r.total} m`;
      return `<tr><td>${escapeHtml(r.name)}</td>${cells}<td><strong>${escapeHtml(String(totalLabel))}</strong></td></tr>`;
    }).join('');
    const avgCells = sitAvgs.map((a, i) => {
      const speed = calcSpeedKmh(a, headers[i].durationSec);
      return `<td>${a} m<br><small>${speed}</small></td>`;
    }).join('');
    const totauxCells = sitTotals.map(t => `<td><strong>${t} m</strong></td>`).join('');
    const avgRow = `<tr style="background:#eee;font-weight:bold"><td>Moyenne</td>${avgCells}<td>${avgTotal} m</td></tr>`;
    const totauxRow = `<tr style="background:#e8f5e9;font-weight:bold"><td>Totaux</td>${totauxCells}<td>Séance : ${grandTotal} m</td></tr>`;
    const html = `<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Bilan — ${escapeHtml(session.name)}</title>
  <style>
    @page { size: A4 landscape; margin: 1cm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; color: #000; background: #fff; }
    h1 { font-size: 18pt; margin-bottom: 4px; }
    .meta { font-size: 11pt; color: #333; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; font-size: 10pt; }
    th, td { border: 1px solid #333; padding: 6px 8px; text-align: center; }
    th { background: #eee; }
    td:first-child { text-align: left; }
    thead { display: table-header-group; }
  </style>
</head>
<body>
  <h1>Bilan de séance — Demi-fond EPS</h1>
  <div class="meta">
    <div><strong>Classe :</strong> ${escapeHtml(cls.name)}</div>
    <div><strong>Séance :</strong> ${escapeHtml(session.name)}</div>
    <div><strong>Date :</strong> ${escapeHtml(date)}</div>
  </div>
  <table>
    <thead><tr><th>Élève</th>${sitCols}<th>Total parcouru</th></tr></thead>
    <tbody>${bodyRows}${avgRow}${totauxRow}</tbody>
  </table>
</body>
</html>`;
    const iframe = document.createElement('iframe');
    iframe.setAttribute('aria-hidden', 'true');
    iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
    document.body.appendChild(iframe);
    const win = iframe.contentWindow;
    const doc = win.document;
    doc.open();
    doc.write(html);
    doc.close();
    const cleanup = () => { iframe.remove(); };
    win.addEventListener('afterprint', cleanup, { once: true });
    setTimeout(() => {
      win.focus();
      win.print();
      setTimeout(cleanup, 3000);
    }, 50);
  }

  /* ----- GESTION ABSENCES / DISPENSES ----- */
  function showAbsencesModal(session, classObj) {
    if (!session.attendance) session.attendance = {};
    const rows = (classObj.students || []).map(st => {
      const att = session.attendance[st.id];
      return `
        <div class="attendance-row" data-sid="${st.id}">
          <div class="attendance-student">
            ${avatarHtml(st)}
            <span class="name">${escapeHtml(st.firstName)} ${escapeHtml(st.lastName)}</span>
          </div>
          <button type="button" class="status-btn dispensed-btn${att === 'dispensed' ? ' active' : ''}" data-type="dispensed" title="Dispensé">✚</button>
          <button type="button" class="status-btn absent-btn${att === 'absent' ? ' active' : ''}" data-type="absent" title="Absent">A</button>
          <button type="button" class="status-btn aff-btn${att === 'aff' ? ' active' : ''}" data-type="aff" title="Oubli d'affaires">AFF</button>
        </div>`;
    }).join('');

    showModal(`
      <h3>Absences / dispenses</h3>
      <p class="section-subtitle">Croix verte = dispensé · A rouge = absent · AFF orange = oubli d'affaires · Recliquez pour annuler.</p>
      <div class="attendance-list" id="attendance-list">${rows}</div>
      <div class="modal-actions">
        <button class="btn btn-primary" id="modal-ok">Enregistrer</button>
      </div>
    `, () => {
      const list = document.getElementById('attendance-list');
      loadAvatarsInContainer(list);
      list.querySelectorAll('.attendance-row').forEach(row => {
        const sid = row.dataset.sid;
        row.querySelector('.dispensed-btn').onclick = (e) => {
          e.stopPropagation();
          toggleAttendanceStatus(session, sid, 'dispensed', row);
        };
        row.querySelector('.absent-btn').onclick = (e) => {
          e.stopPropagation();
          toggleAttendanceStatus(session, sid, 'absent', row);
        };
        row.querySelector('.aff-btn').onclick = (e) => {
          e.stopPropagation();
          toggleAttendanceStatus(session, sid, 'aff', row);
        };
      });
      document.getElementById('modal-ok').onclick = () => {
        saveData();
        closeModal();
        render();
      };
    });
  }

  /* ----- ÉDITION ÉLÈVE ----- */
  function showEditStudentModal(cls, student) {
    showModal(`
      <h3>Modifier l'élève</h3>
      <div class="form-row">
        <div class="form-group"><label>Nom</label><input id="edit-last" value="${escapeHtml(student.lastName)}"></div>
        <div class="form-group"><label>Prénom</label><input id="edit-first" value="${escapeHtml(student.firstName)}"></div>
        <div class="form-group"><label>Sexe</label>
          <select id="edit-gender"><option value="">—</option>
            <option value="M" ${student.gender==='M'?'selected':''}>M</option>
            <option value="F" ${student.gender==='F'?'selected':''}>F</option>
          </select></div>
        <div class="form-group"><label>VMA (km/h)</label>
          <input id="edit-vma" type="text" inputmode="decimal" placeholder="Optionnel"
            value="${getStudentVma(student) != null ? getStudentVma(student) : ''}"></div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="modal-cancel">Annuler</button>
        <button class="btn btn-primary" id="modal-confirm">Enregistrer</button>
      </div>
    `, () => {
      document.getElementById('modal-cancel').onclick = closeModal;
      document.getElementById('modal-confirm').onclick = () => {
        student.lastName = document.getElementById('edit-last').value.trim() || student.lastName;
        student.firstName = document.getElementById('edit-first').value.trim() || student.firstName;
        student.gender = document.getElementById('edit-gender').value;
        const vmaRaw = document.getElementById('edit-vma').value;
        const vma = parseVmaInput(vmaRaw);
        if (vmaRaw.trim() && vma == null) { showAlert('VMA invalide (nombre positif en km/h).'); return; }
        if (vma != null) student.vma = vma;
        else delete student.vma;
        saveData();
        closeModal();
        render();
      };
    });
  }

  /* ----- ACTIONS ----- */
  function bindActions(app, ctx = {}) {
    app.querySelectorAll('[data-action]').forEach(el => {
      el.onclick = (e) => {
        e.stopPropagation();
        handleAction(el.dataset.action, el, ctx);
      };
    });
    app.querySelectorAll('[data-action="series-count"]').forEach(inp => {
      inp.onchange = () => {
        const session = getSession(ctx.sessionId);
        const idx = parseInt(inp.dataset.idx);
        session.situations[idx].seriesCount = Math.max(1, parseInt(inp.value.replace(/\D/g, '')) || 1);
        inp.value = session.situations[idx].seriesCount;
        saveData();
      };
      inp.oninput = (e) => { e.target.value = e.target.value.replace(/\D/g, ''); };
    });
    app.querySelectorAll('[data-action="repetitions-count"]').forEach(inp => {
      inp.onchange = () => {
        const session = getSession(ctx.sessionId);
        const idx = parseInt(inp.dataset.idx);
        session.situations[idx].repetitions = Math.max(1, parseInt(inp.value.replace(/\D/g, '')) || 1);
        inp.value = session.situations[idx].repetitions;
        saveData();
      };
      inp.oninput = (e) => { e.target.value = e.target.value.replace(/\D/g, ''); };
    });
  }

  function handleAction(action, el, ctx) {
    switch (action) {
      case 'open-class':
        navigate('class-sessions', { classId: el.dataset.id }); break;
      case 'config-classes':
        navigate('config-classes'); break;
      case 'config-situations':
        navigate('config-situations'); break;
      case 'open-tutorial':
        navigate('tutorial'); break;
      case 'app-settings':
        navigate('app-settings'); break;
      case 'export-app-data':
        exportAppBackup(); break;
      case 'import-app-data':
        document.getElementById('backup-import-input').click(); break;
      case 'factory-reset':
        confirmAction(
          'Remettre l\'application à zéro ? Toutes les classes, situations, séances, bilans et photos seront supprimés.',
          () => { factoryResetApp(); }
        ); break;
      case 'add-class':
        promptInput('Nom de la nouvelle classe', '', (name) => {
          const id = uid();
          appData.classes.push({ id, name, students: [], colorIndex: nextClassColorIndex() });
          saveData();
          navigate('class-edit', { classId: id, isNew: true });
        }); break;
      case 'edit-class':
        navigate('class-edit', { classId: el.dataset.id }); break;
      case 'delete-class':
        confirmAction('Supprimer définitivement cette classe et toutes ses séances ?', () => {
          const id = ctx.classId;
          appData.classes = appData.classes.filter(c => c.id !== id);
          appData.sessions = appData.sessions.filter(s => s.classId !== id);
          saveData();
          navigate('config-classes');
        }); break;
      case 'add-student':
        document.getElementById('add-student-form').hidden = false; break;
      case 'save-new-student': {
        const cls = getClass(ctx.classId);
        const last = document.getElementById('st-last').value.trim();
        const first = document.getElementById('st-first').value.trim();
        if (!last || !first) { showAlert('Nom et prénom requis.'); return; }
        const student = { id: uid(), lastName: last, firstName: first, gender: document.getElementById('st-gender').value };
        const vmaRaw = document.getElementById('st-vma').value;
        const vma = parseVmaInput(vmaRaw);
        if (vmaRaw.trim() && vma == null) { showAlert('VMA invalide (nombre positif en km/h).'); return; }
        if (vma != null) student.vma = vma;
        cls.students.push(student);
        saveData();
        render();
      } break;
      case 'edit-student': {
        const cls = getClass(ctx.classId);
        const st = cls.students.find(s => s.id === el.dataset.id);
        if (st) showEditStudentModal(cls, st);
      } break;
      case 'delete-student':
        confirmAction('Supprimer cet élève ?', async () => {
          const cls = getClass(ctx.classId);
          const id = el.dataset.id;
          cls.students = cls.students.filter(s => s.id !== id);
          await deletePhoto(id);
          delete photoCache[id];
          saveData();
          render();
        }); break;
      case 'photo-student':
        currentPhotoStudentId = el.dataset.id;
        document.getElementById('photo-input').click(); break;
      case 'pick-photo-student':
        currentPhotoStudentId = el.dataset.id;
        document.getElementById('photo-gallery-input').click(); break;
      case 'delete-photo-student':
        confirmAction('Supprimer la photo de cet élève ?', async () => {
          const id = el.dataset.id;
          await deletePhoto(id);
          delete photoCache[id];
          render();
        }); break;
      case 'import-csv':
        document.getElementById('csv-import-input').dataset.classId = ctx.classId;
        document.getElementById('csv-import-input').click(); break;
      case 'add-situation':
        promptInput('Nom de la nouvelle situation', '', (name) => {
          const id = uid();
          appData.situations.push({ id, name, lapSize: 200, plotInterval: 50, colorIndex: nextSituationColorIndex() });
          saveData();
          navigate('situation-edit', { situationId: id, isNew: true });
        }); break;
      case 'edit-situation':
        navigate('situation-edit', { situationId: el.dataset.id }); break;
      case 'delete-situation':
        confirmAction('Supprimer cette situation ?', () => {
          appData.situations = appData.situations.filter(s => s.id !== ctx.situationId);
          saveData();
          navigate('config-situations');
        }); break;
      case 'add-session':
        promptSessionForm('Nouvelle séance', {}, (name, date) => {
          const id = uid();
          appData.sessions.push({ id, classId: el.dataset.classId || ctx.classId, name, date, attendance: {}, situations: [] });
          saveData();
          navigate('session', { sessionId: id });
        }); break;
      case 'open-session':
        navigate('session', { sessionId: el.dataset.id }); break;
      case 'rename-session': {
        const session = getSession(ctx.sessionId);
        promptSessionForm('Modifier la séance', { name: session?.name, date: session?.date || getTodayIsoDate() }, (name, date) => {
          session.name = name;
          session.date = date;
          saveData();
          render();
        });
      } break;
      case 'delete-session':
        confirmAction('Supprimer cette séance et tous ses résultats ?', () => {
          appData.sessions = appData.sessions.filter(s => s.id !== ctx.sessionId);
          saveData();
          goBack();
        }); break;
      case 'manage-absences': {
        const session = getSession(ctx.sessionId);
        showAbsencesModal(session, getClass(session.classId));
      } break;
      case 'add-situation-to-session': {
        const sel = document.getElementById('add-situation-select');
        if (!sel?.value) { showAlert('Choisissez une situation.'); return; }
        const session = getSession(ctx.sessionId);
        if (sel.value === LIBRE_SITUATION_VALUE) {
          session.situations.push({ isLibre: true, librePerf: { completed: false, values: {} } });
        } else {
          session.situations.push({ templateId: sel.value, seriesCount: 1, repetitions: 1, series: [] });
        }
        saveData();
        render();
      } break;
      case 'remove-situation':
        confirmAction('Supprimer cette situation de la séance ?', () => {
          const session = getSession(ctx.sessionId);
          session.situations.splice(parseInt(el.dataset.idx), 1);
          saveData();
          render();
        }); break;
      case 'move-up': {
        const session = getSession(ctx.sessionId);
        const idx = parseInt(el.dataset.idx);
        if (idx > 0) {
          [session.situations[idx - 1], session.situations[idx]] = [session.situations[idx], session.situations[idx - 1]];
          saveData(); render();
        }
      } break;
      case 'move-down': {
        const session = getSession(ctx.sessionId);
        const idx = parseInt(el.dataset.idx);
        if (idx < session.situations.length - 1) {
          [session.situations[idx], session.situations[idx + 1]] = [session.situations[idx + 1], session.situations[idx]];
          saveData(); render();
        }
      } break;
      case 'launch-situation': {
        const session = getSession(ctx.sessionId);
        const cls = getClass(session.classId);
        const sitIdx = parseInt(el.dataset.idx);
        const ss = session.situations[sitIdx];
        const seriesCount = getSeriesCount(ss);
        const completed = (ss.series || []).filter(s => s.completed).length;
        const seriesIdx = completed;
        if (seriesIdx >= seriesCount) {
          showAlert('Toutes les séries ont été réalisées. Remettez à zéro ou augmentez le nombre de séries.');
          return;
        }
        if (!(cls.students || []).length) { showAlert('Aucun élève dans cette classe.'); return; }
        showStudentSelection(session, cls, sitIdx, seriesIdx, (ids) => {
          launchSituation(ctx.sessionId, sitIdx, seriesIdx, ids);
        });
      } break;
      case 'fill-fractionne-perf':
        navigate('fractionne-perf', { sessionId: ctx.sessionId, sitIdx: parseInt(el.dataset.idx) });
        break;
      case 'fill-libre-perf':
        navigate('libre-perf', { sessionId: ctx.sessionId, sitIdx: parseInt(el.dataset.idx) });
        break;
      case 'reset-situation':
        confirmAction('Remettre cette situation à zéro ?', () => {
          const session = getSession(ctx.sessionId);
          const ss = session.situations[parseInt(el.dataset.idx)];
          ss.series = [];
          delete ss.fractionnePerf;
          delete ss.librePerf;
          saveData(); render();
        }); break;
      case 'plot-plus': {
        const session = getSession(ctx.sessionId);
        const ss = session.situations[ctx.sitIdx];
        const serie = ss.series[ctx.seriesIdx];
        const sid = el.dataset.sid;
        const tpl = getSituation(ss.templateId);
        const r = serie.results[sid] || { laps: 0, extraPlots: 0 };
        r.extraPlots = (r.extraPlots || 0) + 1;
        serie.results[sid] = r;
        const dist = calcDistance(r.laps, r.extraPlots, tpl.lapSize, tpl.plotInterval);
        document.querySelector(`[data-dist="${sid}"]`).textContent = dist;
        saveData();
      } break;
      case 'plot-minus': {
        const session = getSession(ctx.sessionId);
        const ss = session.situations[ctx.sitIdx];
        const serie = ss.series[ctx.seriesIdx];
        const sid = el.dataset.sid;
        const tpl = getSituation(ss.templateId);
        const r = serie.results[sid] || { laps: 0, extraPlots: 0 };
        r.extraPlots = Math.max(0, (r.extraPlots || 0) - 1);
        serie.results[sid] = r;
        const dist = calcDistance(r.laps, r.extraPlots, tpl.lapSize, tpl.plotInterval);
        document.querySelector(`[data-dist="${sid}"]`).textContent = dist;
        saveData();
      } break;
      case 'live-back':
        goBack(); break;
      case 'finish-live':
        confirmAction('Terminer et enregistrer les résultats de cette situation ?', () => {
          const session = getSession(ctx.sessionId);
          const serie = session.situations[ctx.sitIdx].series[ctx.seriesIdx];
          serie.completed = true;
          saveData();
          liveState = null;
          if (liveTimerInterval) { clearInterval(liveTimerInterval); liveTimerInterval = null; }
          if (navStack.length > 1) navStack.pop();
          render();
        }); break;
      case 'open-bilan':
        navigate('bilan', { sessionId: ctx.sessionId }); break;
      case 'open-class-bilan':
        navigate('class-bilan', { classId: ctx.classId }); break;
      case 'export-csv':
        exportCSV(ctx.sessionId); break;
      case 'export-pdf':
        exportPDF(ctx.sessionId); break;
    }
  }

  /* ----- INIT ----- */
  function init() {
    loadData();
    document.getElementById('btn-menu').onclick = () => {
      if (isCreatingClass()) cancelNewClass();
      else if (isCreatingSituation()) cancelNewSituation();
      else goHome();
    };
    document.getElementById('btn-back').onclick = () => {
      if (isCreatingClass()) validateNewClass();
      else if (isCreatingSituation()) validateNewSituation();
      else goBack();
    };
    document.getElementById('modal-overlay').onclick = (e) => {
      if (e.target.id === 'modal-overlay') closeModal();
    };

    async function handlePhotoFileSelect(e) {
      const file = e.target.files?.[0];
      if (!file || !currentPhotoStudentId) return;
      const reader = new FileReader();
      reader.onload = async () => {
        await savePhoto(currentPhotoStudentId, reader.result);
        photoCache[currentPhotoStudentId] = reader.result;
        currentPhotoStudentId = null;
        e.target.value = '';
        render();
      };
      reader.readAsDataURL(file);
    }
    document.getElementById('photo-input').onchange = handlePhotoFileSelect;
    document.getElementById('photo-gallery-input').onchange = handlePhotoFileSelect;

    document.getElementById('backup-import-input').onchange = (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const backup = parseAppBackup(reader.result);
          confirmAction(
            'Importer ces données ? Les données actuelles seront remplacées.',
            () => { importAppBackup(backup); }
          );
        } catch (err) {
          showAlert('Impossible d\'importer le fichier : ' + (err.message || 'format invalide'));
        }
      };
      reader.readAsText(file, 'UTF-8');
      e.target.value = '';
    };

    document.getElementById('csv-import-input').onchange = (e) => {
      const file = e.target.files?.[0];
      const classId = e.target.dataset.classId;
      if (!file || !classId) return;
      const reader = new FileReader();
      reader.onload = () => {
        const result = parseCSV(reader.result);
        if (result.error) { showAlert(result.error); return; }
        const cls = getClass(classId);
        result.students.forEach(s => cls.students.push(s));
        saveData();
        let msg = `${result.students.length} élève(s) importé(s).`;
        if (result.errors?.length) msg += '\n\nAvertissements:\n' + result.errors.join('\n');
        showAlert(msg);
        render();
      };
      reader.readAsText(file, 'UTF-8');
      e.target.value = '';
    };

    render();
  }

  document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
